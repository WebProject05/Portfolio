<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chopperla Santosh | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --surface: #EFECE7;
  --border: #E0DDD7;
  --text: #181715;
  --muted: #7A7770;
  --accent: #BF4E20;
  --mono: 'Syne', sans-serif;
  --sans: 'DM Sans', sans-serif;
  --radius: 16px;
}
body.dark {
  --bg: #100F0D;
  --surface: #1C1B18;
  --border: #2C2A26;
  --text: #F0EDE8;
  --muted: #8A8780;
  --accent: #D4622C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 400;
  line-height: 1.65;
  transition: background 0.4s, color 0.4s;
  overflow-x: hidden;
}

/* ─── AMBIENT BACKGROUND ─── */
.ambient-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.18;
  animation: orbFloat linear infinite;
}
body.dark .orb { opacity: 0.12; }
.orb-1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #BF4E20 0%, transparent 70%);
  top: -10%; left: -15%;
  animation-duration: 28s;
}
.orb-2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #2A5C8A 0%, transparent 70%);
  bottom: 5%; right: -10%;
  animation-duration: 22s;
  animation-direction: reverse;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #BF4E20 0%, transparent 70%);
  top: 50%; left: 60%;
  animation-duration: 35s;
  opacity: 0.08;
}
@keyframes orbFloat {
  0%   { transform: translate(0, 0) scale(1); }
  25%  { transform: translate(30px, -40px) scale(1.05); }
  50%  { transform: translate(60px, 20px) scale(0.97); }
  75%  { transform: translate(20px, 50px) scale(1.03); }
  100% { transform: translate(0, 0) scale(1); }
}

/* ─── LAYOUT ─── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
}

/* ─── HEADER ─── */
header.site-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px;
  background: transparent;
  transition: background 0.3s, border-color 0.3s;
  border-bottom: 1px solid transparent;
}
header.site-header.scrolled {
  background: rgba(247,245,242,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom-color: var(--border);
}
body.dark header.site-header.scrolled {
  background: rgba(16,15,13,0.85);
}
nav { display: flex; gap: 0.15rem; align-items: center; }
.nav-link {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  padding: 0.35rem 0.7rem;
  border-radius: 8px;
  letter-spacing: 0.02em;
  transition: color 0.2s, background 0.2s;
}
.nav-link:hover { color: var(--text); background: var(--surface); }
.nav-link.active { color: var(--text); }
.theme-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.95rem;
  transition: color 0.2s, background 0.2s;
}
.theme-btn:hover { color: var(--text); }

/* ─── HERO ─── */
.hero {
  padding: 4rem 0 3rem;
  opacity: 0;
  animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
}
.hero-eyebrow {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.hero-eyebrow::before {
  content: '';
  width: 20px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}
.page-title {
  font-family: var(--mono);
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 0.75rem;
}
.page-sub {
  font-size: 0.9rem;
  color: var(--muted);
  font-weight: 300;
  max-width: 420px;
}

/* ─── SECTION LABEL ─── */
.section-label {
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

section {
  margin-bottom: 3.5rem;
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  animation-delay: 0.15s;
}

/* ─── REACH CARDS ─── */
.reach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.reach-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.4rem;
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: border-color 0.2s, transform 0.25s cubic-bezier(0.22,1,0.36,1);
  position: relative;
  overflow: hidden;
}
.reach-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}
.reach-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.reach-card:hover::before { opacity: 0.04; }

.reach-icon-wrap {
  width: 40px; height: 40px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 1.2rem;
  color: var(--accent);
  transition: border-color 0.2s;
}
.reach-card:hover .reach-icon-wrap { border-color: var(--accent); }

.reach-info { min-width: 0; }
.reach-label {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  display: block;
  margin-bottom: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.reach-value {
  font-size: 0.76rem;
  color: var(--muted);
  font-weight: 300;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── FOOTER ─── */
footer.site-footer {
  border-top: 1px solid var(--border);
  padding-top: 1.75rem;
  margin-top: 4rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-copy { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
.footer-links { display: flex; gap: 0.25rem; }
.footer-icon { font-size: 1.1rem; color: var(--muted); text-decoration: none; padding: 0.4rem; transition: color 0.2s; border-radius: 6px; }
.footer-icon:hover { color: var(--text); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
  .reach-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="ambient-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="wrap">
  <header class="site-header" id="hdr">
    <nav>
      <a href="index.html" class="nav-link">home</a>
      <a href="blog.html" class="nav-link">blog</a>
      <a href="contact.html" class="nav-link active">contact</a>
    </nav>
    <button class="theme-btn" id="theme-btn"><i class="ri-moon-line"></i></button>
  </header>

  <div class="hero">
    <p class="hero-eyebrow">Say hello</p>
    <h1 class="page-title">Get in Touch</h1>
    <p class="page-sub">Have a project in mind, want to talk system design, or just say hello — find me on any of these.</p>
  </div>

  <section>
    <p class="section-label">Find me on</p>
    <div class="reach-grid">
      <a href="mailto:your-email@example.com" class="reach-card">
        <div class="reach-icon-wrap"><i class="ri-mail-line"></i></div>
        <div class="reach-info">
          <span class="reach-label">Email</span>
          <span class="reach-value">your-email@example.com</span>
        </div>
      </a>
      <a href="https://medium.com/@ch.santosh2021" class="reach-card">
        <div class="reach-icon-wrap"><i class="ri-medium-fill"></i></div>
        <div class="reach-info">
          <span class="reach-label">Medium</span>
          <span class="reach-value">@ch.santosh2021</span>
        </div>
      </a>
      <a href="#" class="reach-card">
        <div class="reach-icon-wrap"><i class="ri-github-fill"></i></div>
        <div class="reach-info">
          <span class="reach-label">GitHub</span>
          <span class="reach-value">github.com/chSantosh</span>
        </div>
      </a>
      <a href="#" class="reach-card">
        <div class="reach-icon-wrap"><i class="ri-linkedin-fill"></i></div>
        <div class="reach-info">
          <span class="reach-label">LinkedIn</span>
          <span class="reach-value">Chopperla Santosh</span>
        </div>
      </a>
    </div>
  </section>

  <footer class="site-footer">
    <span class="footer-copy">© 2026 Chopperla Santosh</span>
    <div class="footer-links">
      <a href="#" class="footer-icon"><i class="ri-github-fill"></i></a>
      <a href="#" class="footer-icon"><i class="ri-linkedin-fill"></i></a>
      <a href="https://medium.com/@ch.santosh2021" class="footer-icon"><i class="ri-medium-fill"></i></a>
    </div>
  </footer>
</div>

<script>
  const btn = document.getElementById('theme-btn');
  const icon = btn.querySelector('i');
  if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); icon.className = 'ri-sun-line'; }
  btn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    icon.className = dark ? 'ri-sun-line' : 'ri-moon-line';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  });
  window.addEventListener('scroll', () => {
    document.getElementById('hdr').classList.toggle('scrolled', window.scrollY > 10);
  });
</script>
</body>
</html>
